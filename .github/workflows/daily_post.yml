name: Täglicher GOLDGESUND Instagram Post

on:
  schedule:
    # Jeden Tag um 9:00 Uhr MEZ / MESZ (= 7:00 UTC Winter, 7:00 UTC Sommer)
    # GitHub Actions läuft in UTC → 7 Uhr UTC = 9 Uhr DE-Sommerzeit
    - cron: "0 7 * * *"
  # Manueller Start möglich (zum Testen)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: GOLDGESUND Post erstellen und veröffentlichen
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN:   ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID:    ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME:    ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:       ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:    ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python generate_and_post.py
