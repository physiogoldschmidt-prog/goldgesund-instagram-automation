name: Täglicher GOLDGESUND Instagram Post

on:
  schedule:
    # Jeden Tag um 9:00 Uhr MEZ / MESZ (= 7:00 UTC Winter, 7:00 UTC Sommer)
    # GitHub Actions läuft in UTC → 7 Uhr UTC = 9 Uhr DE-Sommerzeit
    - cron: "0 7 * * *"
  # Manueller Start möglich (zum Testen)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: GOLDGESUND Post erstellen und Vorschau senden
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:      ${{ github.repository }}
          BREVO_API_KEY:          ${{ secrets.BREVO_API_KEY }}
          MAKE_APPROVAL_WEBHOOK:  ${{ secrets.MAKE_APPROVAL_WEBHOOK }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
        run: python generate_and_post.py
